[tool.poetry]
name = "pinry"
version = "2.1.9"
description = "Pinry, a tiling image board system for people who want to save, tag, and share images, videos and webpages in an easy to skim through format. It's open-source and self-hosted."
authors = ["winkidney <winkidney@gmail.com>"]
license = "BSD 2-Clause"

[tool.poetry.dependencies]
python = ">=3.9,<3.10"
requests = "==2.32.5"
django = "==4.2.30"
pillow = "==11.3.0"
urllib3 = "==2.6.3"
markdown = "*"
django-filter = "==25.1"
psycopg2-binary = "2.9.9"
django-taggit = "==6.1.0"
django-braces = "^1.15.0"
django-compressor = "^4.0"
mock = "^4.0.3"
gunicorn = "==23.0.0"
djangorestframework = "==3.16.1"
drf-spectacular = "==0.30.0"
drf-spectacular-sidecar = "==2026.7.1"


[tool.poetry.dev-dependencies]
flake8 = "*"
qrcode = "*"
django-extensions = "*"
mkdocs = "*"
mkdocs-material = "*"
jinja2 = "==3.0.3"
black = "==19.10b0"

[tool.poetry.group.dev.dependencies]
jinja2 = "3.0.3"
mkdocs-material = "8.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"
