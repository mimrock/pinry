[project]
name = "pinry"
version = "2.1.9"
description = "Pinry, a tiling image board system for people who want to save, tag, and share images, videos and webpages in an easy to skim through format. It's open-source and self-hosted."
authors = [
    { name = "winkidney", email = "winkidney@gmail.com" },
]
license = "BSD-2-Clause"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
requests = "==2.33.0"
django = "==5.1.15"
pillow = "==11.3.0"
urllib3 = "==2.7.0"
markdown = "==3.10.2"
django-filter = "==25.1"
psycopg2-binary = "==2.9.12"
django-taggit = "==6.1.0"
django-braces = "==1.17.0"
django-compressor = "==4.6.0"
gunicorn = "==26.0.0"
djangorestframework = "==3.16.1"
drf-spectacular = "==0.30.0"
drf-spectacular-sidecar = "==2026.7.1"

[tool.poetry.group.dev.dependencies]
black = "==26.5.1"
django-extensions = "==4.1"
flake8 = "==7.3.0"
jinja2 = "==3.1.6"
mkdocs = "==1.6.1"
mkdocs-material = "==9.7.6"
qrcode = "==8.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"
